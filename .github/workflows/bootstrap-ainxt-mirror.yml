name: Bootstrap unofficial AiNxt source mirror

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-ainxt-mirror.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save bootstrap workflow
        run: cp .github/workflows/bootstrap-ainxt-mirror.yml /tmp/bootstrap-ainxt-mirror.yml

      - name: Fetch and mirror NPCI AiNxt Enterprise
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/npci/ainxt-enterprise.git
          git fetch --depth=1 upstream main
          git switch -c mirror/npci-ainxt-enterprise
          git rm -rf --ignore-unmatch .
          # The GitHub Actions token cannot push changes to workflow files; copy upstream workflows separately after the branch exists.
          git checkout upstream/main -- . ':!.github/workflows/**'
          mkdir -p .github/workflows
          cp /tmp/bootstrap-ainxt-mirror.yml .github/workflows/bootstrap-ainxt-mirror.yml
          cat > MIRROR-INFO.md <<'EOF'
          # Unofficial AiNxt Enterprise mirror

          This repository contains a source mirror of [NPCI AiNxt Enterprise](https://github.com/npci/ainxt-enterprise).

          - Upstream repository: https://github.com/npci/ainxt-enterprise
          - Upstream snapshot commit: `9b9690f05bcc4f0d8e9d075fb8738c86d4f6f0de`
          - License: MIT; see `LICENSE`.
          - Third-party license notices: see `THIRD-PARTY-NOTICES.md`.
          - Trademark and brand conditions: see `NOTICE`.

          This is an independent, unofficial mirror for evaluation and learning. It is not maintained, certified, operated, or endorsed by NPCI. Do not represent it as the official AiNxt distribution.
          EOF
          git add -A
          git commit -m "chore: mirror NPCI AiNxt Enterprise source"
          # This is a dedicated mirror branch created for this task. Replace its stale bootstrap history.
          git push --force origin HEAD:refs/heads/mirror/npci-ainxt-enterprise

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head mirror/npci-ainxt-enterprise \
            --title "Mirror NPCI AiNxt Enterprise source" \
            --body "Creates an unofficial source mirror of [NPCI AiNxt Enterprise](https://github.com/npci/ainxt-enterprise), preserving the upstream source files, MIT license, NOTICE, and third-party notices. See MIRROR-INFO.md for provenance and the unofficial status. This PR targets this repository only; it is not a PR to NPCI."
